<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>转发工具接口调用</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/detail.css') }}?v=1">
</head>
<body>
<div class="container">
    <h1>自动转发工具发布详情</h1>
    <div class="api-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="section-title">种子状态列表</h2>
            <a href="/" class="back-button">返回首页</a>
        </div>

        <!-- 筛选控件区域 -->
        <div class="filter-section">
            <div class="filter-controls">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <label for="statusFilter">上传状态:</label>
                    <select id="statusFilter">
                        <option value="">全部</option>
                        <option value="0">未发布</option>
                        <option value="1">已发布</option>
                        <option value="2">已跳过</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table id="torrentTable" class="torrent-table">
                <thead>
                <tr>
                    <th>哈希值</th>
                    <th>源站</th>
                    <th>目标站</th>
                    <th>下载状态</th>
                    <th>上传状态</th>
                    <th>说明</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="torrentTableBody">
                </tbody>
            </table>
            <div class="pagination">
                <button type="button" id="prevPageBtn">上一页</button>
                <button type="button" id="nextPageBtn">下一页</button>
            </div>
        </div>

    </div>
</div>
<script src="{{ url_for('static', filename='js/detail.js') }}?v=1"></script>
</body>
</html>
