<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>转发工具接口调用</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interface.css') }}?v=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared/modal.css') }}?v=1">
</head>
<body>
<div class="container">
    <h1>自动转发工具接口调用</h1>

    <div class="api-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 class="section-title">接口列表</h2>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="openSiteModalBtn" class="site-list-btn">查看站点标识对照表</button>
                <a href="/" class="back-button">返回首页</a>
            </div>
        </div>

        <div class="interface-row">
            <div class="interface-container">
                <div class="interface-title">强制执行一次限速 (forceLimit)</div>
                <button type="button" id="forceLimit_btn" class="api-btn">调用接口</button>
                <div class="result" id="forceLimit_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">强制获取RSS数据 (forceRss)</div>
                <button type="button" id="forceRss_btn" class="api-btn">调用接口</button>
                <div class="result" id="forceRss_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">查询未完成任务清单 (unfinished)</div>
                <button type="button" id="unfinished_btn" class="api-btn">调用接口</button>
                <div class="result" id="unfinished_result"></div>
            </div>
        </div>

        <div class="interface-row">
            <div class="interface-container">
                <div class="interface-title">哈希值删除发布任务 (delTorrent)</div>
                <div class="form-group">
                    <label for="delTorrent_h">QB种子信息中的信息哈希值:</label>
                    <input type="text" id="delTorrent_h" placeholder="请输入信息哈希值">
                </div>
                <button type="button" id="delTorrent_btn" class="api-btn">调用接口</button>
                <div class="result" id="delTorrent_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">源站种子重发 (reloadHash)</div>
                <div class="form-group">
                    <label for="reloadHash_h">QB种子信息中的信息哈希值:</label>
                    <input type="text" id="reloadHash_h" placeholder="请输入信息哈希值">
                </div>
                <button type="button" id="reloadHash_btn" class="api-btn">调用接口</button>
                <div class="result" id="reloadHash_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">对目标站重发所有种子 (reloadSite)</div>
                <div class="form-group">
                    <label for="reloadSite_s">目标站点标识:</label>
                    <input type="text" id="reloadSite_s" placeholder="请输入目标站点标识">
                </div>
                <button type="button" id="reloadSite_btn" class="api-btn">调用接口</button>
                <div class="result" id="reloadSite_result"></div>
            </div>
        </div>

        <div class="interface-row">
            <div class="interface-container">
                <div class="interface-title">强制下载种子 (forceDownTorrent)</div>
                <div class="form-group">
                    <label for="forceDownTorrent_h">QB种子信息中的信息哈希值:</label>
                    <input type="text" id="forceDownTorrent_h" placeholder="请输入信息哈希值">
                </div>
                <div class="form-group">
                    <label for="forceDownTorrent_u">种子详情页的下载链接:</label>
                    <input type="text" id="forceDownTorrent_u" placeholder="请输入下载链接">
                </div>
                <button type="button" id="forceDownTorrent_btn" class="api-btn">调用接口</button>
                <div class="result" id="forceDownTorrent_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">目标站点替换接口 (change)</div>
                <div class="form-group">
                    <label for="change_os">原目标站点标识:</label>
                    <input type="text" id="change_os" placeholder="请输入原目标站点标识">
                </div>
                <div class="form-group">
                    <label for="change_ns">新目标站点标识:</label>
                    <input type="text" id="change_ns" placeholder="请输入新目标站点标识">
                </div>
                <button type="button" id="change_btn" class="api-btn">调用接口</button>
                <div class="result" id="change_result"></div>
            </div>
            <div class="interface-container">
                <div class="interface-title">新增站点快速增加本地发布任务 (addNewSite)</div>
                <div class="form-group">
                    <label for="addNewSite_ts">已发目标站点标识:</label>
                    <input type="text" id="addNewSite_ts" placeholder="请输入任意已发目标站点标识，如【ubits.club】">
                </div>
                <div class="form-group">
                    <label for="addNewSite_ns">新增目标站点标识:</label>
                    <input type="text" id="addNewSite_ns" placeholder="请输入新增目标站点标识，如【www.agsvpt.com】">
                </div>
                <button type="button" id="addNewSite_btn" class="api-btn">调用接口</button>
                <div class="result" id="addNewSite_result"></div>
            </div>
        </div>

        <div class="interface-container">
            <div class="interface-title">获取源种存储信息 (getHashInfo)</div>
            <div class="form-group">
                <label for="adminPassword">发种工具密码:</label>
                <input type="password" id="adminPassword" placeholder="请输入密码">
                <label for="getHashInfo_h">QB种子信息中的信息哈希值:</label>
                <input type="text" id="getHashInfo_h" placeholder="请输入信息哈希值">
            </div>
            <button type="button" id="getHashInfo_btn" class="api-btn">调用接口</button>
            <div class="result" id="getHashInfo_result"></div>
        </div>

        <div class="interface-container">
            <div class="interface-title">统计站点发布数据 (statistics)</div>
            <div class="form-group">
                <label for="statistics_s">源站点标识:</label>
                <input type="text" id="statistics_s" placeholder="请输入源站点标识">
            </div>
            <div class="form-group">
                <label for="statistics_ym">查询年月 (格式202501):</label>
                <input type="text" id="statistics_ym" placeholder="请输入查询年月">
            </div>
            <button type="button" id="statistics_btn" class="api-btn">调用接口</button>
            <div class="result" id="statistics_result"></div>
        </div>
    </div>
</div>

<!-- 站点标识对照表模态框 -->
<div id="siteModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">站点标识对照表</h2>
            <button type="button" id="closeSiteModalBtn" class="close-btn" aria-label="关闭">&times;</button>
        </div>
        <div class="site-grid" id="siteListGrid">
            <!-- 站点列表将通过JavaScript动态生成 -->
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/shared/modal.js') }}?v=1"></script>
<script src="{{ url_for('static', filename='js/interface.js') }}?v=1"></script>
</body>
</html>
